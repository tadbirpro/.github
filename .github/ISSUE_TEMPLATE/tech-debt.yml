name: Tech Debt
description: Track maintainability, architecture, quality, or engineering improvements.
type: Tech Debt
body:
  - type: markdown
    attributes:
      value: |
        Use Tech Debt for internal improvements that do not change user-visible behavior. Make the cost of leaving it unaddressed explicit so it can be prioritized.

  - type: checkboxes
    id: existing
    attributes:
      label: Existing Issues
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current State
      description: What technical condition or compromise currently exists?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Why This Is a Problem
      description: Describe the cost, risk, complexity, reliability issue, or developer impact.
    validations:
      required: true

  - type: textarea
    id: desired_state
    attributes:
      label: Desired State
      description: What should the architecture or implementation look like afterward?
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed Approach
      description: Describe a likely solution if one is already known. This is not required to be final.
    validations:
      required: false

  - type: textarea
    id: risk
    attributes:
      label: Risk of Not Addressing
      description: What happens if this debt remains?
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of Done
      description: What must be true before this debt can be considered resolved?
      placeholder: |
        - [ ] ...
        - [ ] Tests updated
        - [ ] Documentation / ADR updated if applicable
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Link ADRs, source locations, incidents, issues, or relevant documentation.
    validations:
      required: false
